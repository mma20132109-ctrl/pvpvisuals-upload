name: Import TargetESP reference textures

on:
  push:
    branches:
      - feature/svintus-hud-visual-parity

permissions:
  contents: write

jobs:
  import-textures:
    if: contains(github.event.head_commit.message, 'Start TargetESP texture import')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/svintus-hud-visual-parity
      - name: Copy original textures from reference JAR extraction
        run: |
          git clone --depth 1 --branch inspect/decompile-targetesp https://github.com/mma20132109-ctrl/targetesp-source.git /tmp/targetesp-reference
          mkdir -p src/main/resources/assets/pvpvisuals/textures/targetesp/original
          cp /tmp/targetesp-reference/extracted-assets/assets/targetespmod/textures/bloom.png src/main/resources/assets/pvpvisuals/textures/targetesp/original/bloom.png
          cp /tmp/targetesp-reference/extracted-assets/assets/targetespmod/textures/wonderful_bloom.png src/main/resources/assets/pvpvisuals/textures/targetesp/original/wonderful_bloom.png
          cp /tmp/targetesp-reference/extracted-assets/assets/targetespmod/textures/image.png src/main/resources/assets/pvpvisuals/textures/targetesp/original/image.png
          cp /tmp/targetesp-reference/extracted-assets/assets/targetespmod/textures/image_2.png src/main/resources/assets/pvpvisuals/textures/targetesp/original/image_2.png
          cp /tmp/targetesp-reference/extracted-assets/assets/targetespmod/textures/image_3.png src/main/resources/assets/pvpvisuals/textures/targetesp/original/image_3.png
          cp /tmp/targetesp-reference/extracted-assets/assets/targetespmod/textures/vega_trianglestipple.png src/main/resources/assets/pvpvisuals/textures/targetesp/original/triangle.png
      - name: Commit imported textures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/assets/pvpvisuals/textures/targetesp/original
          git commit -m "Import original TargetESP reference textures"
          git push origin HEAD:feature/svintus-hud-visual-parity
