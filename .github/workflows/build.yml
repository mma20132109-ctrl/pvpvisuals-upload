name: Build PvPVisuals

on:
  push:
    branches:
      - feature/svintus-hud-visual-parity
  pull_request:
    branches:
      - feature/morph-settings-transition
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Gradle build (Java 21)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        shell: pwsh
        run: .\gradlew.bat --no-daemon build

      - name: Upload built mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pvpvisuals-build
          path: build/libs/*.jar
          if-no-files-found: error
