name: Build and publish mod

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric mod
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: pvpvisuals-1.0.0
          path: build/libs/pvpvisuals-1.0.0.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PvPVisuals build ${{ github.run_number }}
          body: |
            Automatically built from commit ${{ github.sha }}.
            Minecraft 1.21.11 · Fabric · Java 21
          files: build/libs/pvpvisuals-1.0.0.jar
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
